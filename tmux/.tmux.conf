# Pass desktop alerts and progress bars through SSH to the host terminal
set -g allow-passthrough on

# Enable extended keyboard protocol for Claude Code Shift+Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
# Esc interrupts Claude; a nonzero delay makes it lag
set -s escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 100000
