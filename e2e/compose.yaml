x-preset: &preset
  build:
    context: .
    args:
      - UBUNTU_VERSION
  environment:
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    DOTFILES_SKIP_FLATPAK: "1"
  volumes:
    - ..:/src:ro
  stdin_open: false
  tty: false

services:
  work:
    <<: *preset
    command: [work]
  personal:
    <<: *preset
    command: [personal]
  homelab:
    <<: *preset
    command: [homelab]